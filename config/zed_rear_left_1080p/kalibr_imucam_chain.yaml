%YAML:1.0

# SN43588071 (rear_left), LEFT_CAM_FHD/RIGHT_CAM_FHD. OpenVINS radtan uses
# [k1, k2, p1, p2]; the factory k3 term cannot be represented by this model.
# T_imu_cam maps points from each camera optical frame into the IMU/body frame
# (the same convention as VINS-Fusion body_T_cam). These measured transforms
# assume the IMU/body axes use the supplied NED convention.
cam0:
  T_imu_cam:
    - [0.0, 0.0, 1.0, 0.000000000]
    - [1.0, 0.0, 0.0, -0.035649005]
    - [0.0, 1.0, 0.0, -0.000147000]
    - [0.0, 0.0, 0.0, 1.0]
  cam_overlaps: [1]
  camera_model: pinhole
  distortion_coeffs: [-0.0138379, -0.0311268, 0.000300193, -0.00011167]
  distortion_model: radtan
  intrinsics: [737.947, 737.446, 977.982, 519.909]
  resolution: [1920, 1080]
  rostopic: /openvins/zed_rear_left/left/image_raw

cam1:
  T_imu_cam:
    - [0.0, 0.0, 1.0, 0.000000000]
    - [1.0, 0.0, 0.0, 0.084387395]
    - [0.0, 1.0, 0.0, -0.000147000]
    - [0.0, 0.0, 0.0, 1.0]
  cam_overlaps: [0]
  camera_model: pinhole
  distortion_coeffs: [-0.0175787, -0.0264474, 0.000209482, -0.000353237]
  distortion_model: radtan
  intrinsics: [737.148, 736.715, 960.115, 524.122]
  resolution: [1920, 1080]
  rostopic: /openvins/zed_rear_left/right/image_raw