%YAML:1.0

verbosity: "INFO"

use_fej: true
integration: "rk4"
use_stereo: true
max_cameras: 2

# Keep the supplied measured camera/IMU transforms fixed. Optimizing the old
# guessed transforms online caused them to drift and destabilized the filter.
calib_cam_extrinsics: false
calib_cam_intrinsics: false
calib_cam_timeoffset: true
calib_imu_intrinsics: false
calib_imu_g_sensitivity: false

max_clones: 11
max_slam: 50
max_slam_in_update: 25
max_msckf_in_update: 40
dt_slam_delay: 1
gravity_mag: 9.81

feat_rep_msckf: "GLOBAL_3D"
feat_rep_slam: "ANCHORED_MSCKF_INVERSE_DEPTH"
feat_rep_aruco: "ANCHORED_MSCKF_INVERSE_DEPTH"

# The recorded sequence begins nearly stationary. Enabling startup-only ZUPT
# lets OpenVINS initialize from that static window instead of waiting forever
# for a >10 px visual-motion transition and >1.5 m/s^2 IMU excitation.
try_zupt: true
zupt_chi2_multipler: 0
zupt_max_velocity: 0.1
zupt_noise_multiplier: 10
zupt_max_disparity:  0.5 #2.0 #0.5
zupt_only_at_beginning: true

init_window_time: 2.0
init_imu_thresh: 1.5
init_max_disparity: 10.0
init_max_features: 50

init_dyn_use: false
init_dyn_mle_opt_calib: false
init_dyn_mle_max_iter: 50
init_dyn_mle_max_time: 0.05
init_dyn_mle_max_threads: 6
init_dyn_num_pose: 6
init_dyn_min_deg: 10.0
init_dyn_inflation_ori: 10
init_dyn_inflation_vel: 100
init_dyn_inflation_bg: 10
init_dyn_inflation_ba: 100
init_dyn_min_rec_cond: 1e-12
init_dyn_bias_g: [0.0, 0.0, 0.0]
init_dyn_bias_a: [0.0, 0.0, 0.0]

record_timing_information: false
record_timing_filepath: "/tmp/traj_timing.txt"
save_total_state: false
filepath_est: "/tmp/ov_estimate.txt"
filepath_std: "/tmp/ov_estimate_std.txt"
filepath_gt: "/tmp/ov_groundtruth.txt"

# The recordings contain 60 Hz 1920x1080 frames. Tracking at 30 Hz limits
# compute load while preserving the original timestamps.
use_klt: true
num_pts: 250
fast_threshold: 20
grid_x: 8
grid_y: 5
min_px_dist: 20
knn_ratio: 0.70
track_frequency: 20.0
downsample_cameras: true
num_opencv_threads: 4
histogram_method: "HISTOGRAM"

# Detect AprilTag 36h11 markers through OpenCV's ArUco module. Each detected
# corner is retained as a persistent SLAM feature; physical marker size is not
# used to estimate a standalone tag pose.
use_aruco: true #true
aruco_tag_dictionary: "DICT_APRILTAG_36h11"
aruco_track_frequency: 5.0
# [x, y, width, height] normalized to the 960x540 OpenVINS image. The tag
# remains in the lower-right quadrant, so scan that full-resolution region.
aruco_detection_roi: [0.5, 0.5, 0.5, 0.5]
num_aruco: 587
downsize_aruco: false

up_msckf_sigma_px: 1
up_msckf_chi2_multipler: 1
up_slam_sigma_px: 1
up_slam_chi2_multipler: 1
up_aruco_sigma_px: 1
up_aruco_chi2_multipler: 1

use_mask: false

relative_config_imu: "kalibr_imu_chain.yaml"
relative_config_imucam: "kalibr_imucam_chain.yaml"