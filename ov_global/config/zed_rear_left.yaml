# ov_global parameters for the ZED X rear-left camera on the ferry.
# Angles in degrees, distances in metres unless noted. Values marked TODO must be surveyed.

tag_pnp_node:
  ros__parameters:
    image_topic: /openvins/zed_rear_left/left/image_raw
    camera_info_topic: "" # empty -> use imucam_yaml intrinsics
    camera_id: 0
    camera_frame: cam0
    tag_pose_topic: /ov_global/tag_pose
    tag_size_m: 0.162 # TODO: measured black-border edge length
    tag_dictionary: DICT_APRILTAG_36h11
    tag_id: 303
    detection_roi: [0.0, 0.0, 1.0, 1.0] # normalized [x, y, w, h]
    corner_sigma_px: 0.5
    max_reproj_error_px: 2.0
    max_range_m: 200.0

global_alignment_node:
  ros__parameters:
    vio_topic: /ov_msckf/odomimu
    # vio_landmarks: anchor map->global on the tag corners OpenVINS keeps as SLAM landmarks
    #                (/ov_msckf/points_aruco); OpenVINS does the loop closure, no PnP node needed.
    # pnp:           fuse tag_pnp_node detections as gated EKF/replace step corrections.
    tag_source: vio_landmarks
    landmarks_topic: /ov_msckf/points_aruco
    tag_pose_topic: /ov_global/tag_pose
    map_frame: map # ENU at ref_lla_deg
    ned_frame: world_ned # NED at ref_lla_deg (autoferry convention)
    global_frame: global # OpenVINS world
    imu_frame: imu
    base_frame: base_link # vessel body, SNAME (x fwd, y stbd, z down)
    antenna_frame: gnss_antenna
    publish_tf: true
    publish_static_tf: true

    # --- vehicle geometry (base_link = base_link_sname_estimated, SNAME: x fwd, y stbd, z down)
    camera_id: 0
    p_base_cam: [-18.923, 4.628, -1.341] # CRSB: ZED rear-left cam0 optical centre (frames.yaml)
    # mount rpy [deg] applied to a level, forward-looking camera; yaw 180 = looking aft.
    # TODO: adjust yaw if the camera is angled (e.g. 180 +/- pan), roll/pitch for tilt.
    cam_mount_rpy_deg: [0.0, 0.0, 180.0]
    p_base_antenna: [-10.343, 3.333, -3.531] # GR antenna lever arm (frames.yaml)

    # --- map origin and fiducial survey (tag_* names kept; the fiducial is the checkerboard centre)
    # Wittow (Ruegen) reference point, ellipsoidal height.
    ref_lla_deg: [54.55622916, 13.2463241, 41.554]
    # Surveyed 2026-09-11 (rosbag2_2026_09_11-13_32_02, RTK gpsd fixes, Scripts/rosbag/survey_target_from_bag.py):
    # antenna on top of the 0.7 m AprilTag -> tag centre = 2.769 m - 0.35 m. The receiver reports MSL
    # heights; +36.076 m EGM96 undulation applied to get ellipsoidal height. Face fitted through right/centre/left points
    # (rms 1.2 cm over 5.6 m).
    tag_center_lla_deg: [54.55469463, 13.24491467, 38.495]
    # simpleRTK3B + u-blox ANN-MB2: phase centre 6.4-9.1 mm above the antenna base (ARP) -> -0.008
    tag_center_offset_up_m: -0.008
    tag_facing_azimuth_deg: 50.38 # outward normal of the target face (looks NE); back side would be 230.38
    tag_tilt_deg: 0.0
    tag_roll_deg: 0.0
    # survey: RTK 1-2 cm + hand-centering of the antenna on the tag; height datum bias (geoid model) not included
    tag_pos_sigma_m: 0.03
    # survey: face line fit ~0.15 deg formal; margin for antenna placement on the face and unmeasured tag tilt
    tag_yaw_sigma_deg: 0.5
    # OpenVINS checkerboard landmarks: 7x5 inner corners, 210 mm squares (see estimator_config.yaml).
    # For the AprilTag use landmark_grid_cols/rows 2 and landmark_spacing_m = tag_size_m (0.7).
    tag_size_m: 0.7
    landmark_grid_cols: 7
    landmark_grid_rows: 5
    landmark_spacing_m: 0.21
    landmark_sigma_m: 0.05 # assumed accuracy of the OpenVINS fiducial landmarks
    landmark_square_tolerance: 0.25

    # --- initialisation
    init_mode: gnss # gnss | tag
    init_lla_deg: [54.176852, 12.095446, 5.14] # antenna LLA at VIO start (hgt+undulation)
    init_heading_ned_deg: 0.0 # base_link heading at VIO start (heading2)
    init_pos_sigma_m: 1.0
    init_heading_sigma_deg: 2.0
    gnss_fix_topic: "" # optional sensor_msgs/NavSatFix that overrides init_lla_deg

    # --- correction (pnp source only, except max_corrections)
    correction_mode: kalman # kalman | replace
    chi2_gate_prob: 0.99
    drift_pos_per_m: 0.02
    drift_yaw_deg_per_m: 0.05
    min_correction_interval_s: 0.0
    max_corrections: 0 # 0 = unlimited; 1 = anchor once and never move again
    max_tag_vio_dt_s: 0.05
